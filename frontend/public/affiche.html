<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>EpiQuest — Affiche QR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #F5F4F2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .poster {
      background: #1A1A2E;
      color: #fff;
      border-radius: 32px;
      padding: 56px 48px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .bolt {
      width: 72px; height: 72px;
      background: #4F46E5;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 44px; letter-spacing: -1px; }
    .sub { color: rgba(255,255,255,.55); font-size: 16px; margin-top: 6px; }
    .qr {
      background: #fff;
      border-radius: 24px;
      padding: 24px;
      margin: 36px auto 0;
      width: 300px; height: 300px;
    }
    .qr img { width: 100%; height: 100%; display: block; }
    .cta { margin-top: 28px; font-size: 20px; font-weight: 700; }
    .url { color: #818CF8; font-size: 15px; margin-top: 8px; font-family: ui-monospace, monospace; }
    .games { margin-top: 26px; display: flex; justify-content: center; gap: 18px; color: rgba(255,255,255,.75); font-size: 14px; }
    @media print {
      body { background: #fff; padding: 0; }
      .poster { border-radius: 0; max-width: none; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
      .qr { width: 340px; height: 340px; }
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="bolt">⚡</div>
    <h1>EpiQuest</h1>
    <p class="sub">Journée Portes Ouvertes — Epitech</p>
    <div class="qr">
      <img src="/qr.svg" alt="QR code vers epiquest.vercel.app" />
    </div>
    <p class="cta">📱 Scanne &amp; joue !</p>
    <p class="url">epiquest.vercel.app</p>
    <div class="games">
      <span>🧠 Quiz</span>
      <span>🃏 Mémoire</span>
      <span>🧩 Code</span>
    </div>
  </div>
</body>
</html>
