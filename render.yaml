# Render blueprint: deploys the EpiQuest backend (persistent Node server with
# Socket.io) and a managed PostgreSQL database. Vercel can't host this part.
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: epiquest-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: epiquest-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://epiquest.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Set these in the Render dashboard (do not commit secrets):
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Set to https://<your-render-service>.onrender.com/auth/google/callback
      # once Render assigns the service URL (must match the Google console).
      - key: GOOGLE_CALLBACK_URL
        sync: false

databases:
  - name: epiquest-db
    plan: free
